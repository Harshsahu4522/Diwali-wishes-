<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Diwali | Electronic Tech Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #030307;
            color: #fff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Tech Background Grid Effect */
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: 
                linear-gradient(rgba(255, 153, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 153, 0, 0.03) 1px, transparent 1px);
            background-size: 35px 35px;
            z-index: 1;
            animation: gridMove 15s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(-35px); }
        }

        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 440px;
            padding: 30px 25px;
            background: rgba(12, 12, 22, 0.95);
            border: 1px solid rgba(255, 153, 0, 0.4);
            border-radius: 20px;
            box-shadow: 0 0 35px rgba(255, 153, 0, 0.2), inset 0 0 20px rgba(255, 69, 0, 0.1);
            backdrop-filter: blur(12px);
        }

        .badge {
            display: inline-block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 5px 14px;
            border-radius: 20px;
            background: rgba(255, 153, 0, 0.1);
            color: #ffcc00;
            border: 1px solid #ffcc00;
            margin-bottom: 15px;
            box-shadow: 0 0 10px rgba(255, 153, 0, 0.2);
        }

        h1 {
            color: #ffcc00;
            font-size: 26px;
            margin-bottom: 15px;
            text-shadow: 0 0 12px rgba(255, 204, 0, 0.6);
        }

        p {
            color: #cccccc;
            font-size: 15px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 15px;
            margin-bottom: 20px;
            border: 1.5px solid #ffcc00;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 16px;
            text-align: center;
            outline: none;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.2);
            transition: 0.3s;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 22px rgba(255, 153, 0, 0.7);
            border-color: #ff3300;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff6600, #ff0055);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.5);
            transition: 0.3s transform, 0.3s box-shadow;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(255, 102, 0, 0.8);
        }

        .wish-screen {
            display: none;
            animation: fadeIn 0.8s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .diwali-title {
            font-size: 30px;
            color: #ff3300;
            margin-bottom: 12px;
            animation: glow 1.5s infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #ff0000, 0 0 20px #ff6600; }
            to { text-shadow: 0 0 20px #ffff00, 0 0 35px #ff0055; }
        }

        .wish-msg {
            font-size: 16px;
            color: #ffd700;
            line-height: 1.5;
            font-weight: 500;
            margin-bottom: 25px;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
        }

        /* Heart Diya Frame Container */
        .heart-frame {
            position: relative;
            width: 240px;
            height: 180px;
            margin: 15px auto;
        }

        .heart-diya {
            position: absolute;
            font-size: 20px;
            animation: flameGlow 1s infinite alternate;
        }

        @keyframes flameGlow {
            from { filter: drop-shadow(0 0 2px #ff3300); }
            to { filter: drop-shadow(0 0 8px #ffcc00); }
        }

        /* Heart coordinate placement for diyas */
        .d1 { top: 20px; left: 110px; }
        .d2 { top: 10px; left: 85px; }
        .d3 { top: 10px; left: 135px; }
        .d4 { top: 25px; left: 60px; }
        .d5 { top: 25px; left: 160px; }
        .d6 { top: 50px; left: 40px; }
        .d7 { top: 50px; left: 180px; }
        .d8 { top: 80px; left: 35px; }
        .d9 { top: 80px; left: 185px; }
        .d10 { top: 110px; left: 55px; }
        .d11 { top: 110px; left: 165px; }
        .d12 { top: 135px; left: 80px; }
        .d13 { top: 135px; left: 140px; }
        .d14 { top: 155px; left: 110px; }

        .center-name {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 22px;
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 12px rgba(0, 255, 204, 0.8);
            width: 140px;
            word-break: break-word;
        }

        .footer-tag {
            font-size: 12px;
            color: #ffcc00;
            margin-top: 20px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- Step 1: Input Screen -->
    <div class="container" id="inputScreen">
        <div class="badge">🪔 DIWALI SPECIAL 🪔</div>
        <h1>✨ Happy Diwali ✨</h1>
        <p>Enter your name to light up the celebration:</p>
        <input type="text" id="userName" placeholder="Type your name here..." autocomplete="off">
        <button onclick="showWishes()">Light Up Wish</button>
    </div>

    <!-- Step 2: Wishing Screen -->
    <div class="container wish-screen" id="wishScreen">
        <div class="badge">🪔 FESTIVAL OF LIGHTS 🪔</div>
        <h1 class="diwali-title">🪔 Happy Diwali 🪔</h1>
        
        <div class="wish-msg">
            May your this Diwali ignite with lights!
        </div>

        <!-- Heart Shape Diyas with Name in Center -->
        <div class="heart-frame">
            <span class="heart-diya d1">🪔</span>
            <span class="heart-diya d2">🪔</span>
            <span class="heart-diya d3">🪔</span>
            <span class="heart-diya d4">🪔</span>
            <span class="heart-diya d5">🪔</span>
            <span class="heart-diya d6">🪔</span>
            <span class="heart-diya d7">🪔</span>
            <span class="heart-diya d8">🪔</span>
            <span class="heart-diya d9">🪔</span>
            <span class="heart-diya d10">🪔</span>
            <span class="heart-diya d11">🪔</span>
            <span class="heart-diya d12">🪔</span>
            <span class="heart-diya d13">🪔</span>
            <span class="heart-diya d14">🪔</span>
            
            <div class="center-name" id="displayName"></div>
        </div>

        <div class="footer-tag">🪔 Best wishes by Dev 🪔</div>
    </div>

    <script>
        function showWishes() {
            const nameInput = document.getElementById('userName').value.trim();
            if (nameInput === "") {
                alert("Bro, please enter your name first!");
                return;
            }
            document.getElementById('inputScreen').style.display = 'none';
            document.getElementById('wishScreen').style.display = 'block';
            document.getElementById('displayName').innerText = nameInput;
        }
    </script>
</body>
</html>
